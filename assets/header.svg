<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" fill="none">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#40c8ff"/>
      <stop offset="100%" stop-color="#00ffcc"/>
    </linearGradient>
    <radialGradient id="blob1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0050c8"/>
      <stop offset="100%" stop-color="#0050c8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00a8b0"/>
      <stop offset="100%" stop-color="#00a8b0" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#40c8ff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="900" height="220" fill="#020810"/>
  <rect width="900" height="220" fill="url(#grid)"/>

  <ellipse cx="120" cy="60" rx="140" ry="100" fill="url(#blob1)" opacity="0.35">
    <animate attributeName="cx" values="120;180;120" dur="28s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="60;90;60" dur="22s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="780" cy="40" rx="130" ry="95" fill="url(#blob1)" opacity="0.25">
    <animate attributeName="cx" values="780;720;780" dur="32s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="450" cy="180" rx="160" ry="70" fill="url(#blob2)" opacity="0.2">
    <animate attributeName="rx" values="160;190;160" dur="18s" repeatCount="indefinite"/>
  </ellipse>

  <!-- scan line -->
  <rect x="0" y="0" width="900" height="2" fill="#40c8ff" opacity="0.15">
    <animate attributeName="y" values="0;220;0" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- corner brackets -->
  <path d="M 36 36 H 56 V 56" stroke="url(#grad)" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <path d="M 864 36 H 844 V 56" stroke="url(#grad)" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <path d="M 36 184 H 56 V 164" stroke="url(#grad)" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <path d="M 864 184 H 844 V 164" stroke="url(#grad)" stroke-width="2" stroke-linecap="round" opacity="0.7"/>

  <!-- pulsing dot -->
  <circle cx="450" cy="52" r="4" fill="#00ffcc">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="r" values="4;6;4" dur="2s" repeatCount="indefinite"/>
  </circle>

  <text x="450" y="108" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="52" font-weight="700" fill="url(#grad)" filter="url(#glow)">koels</text>
  <text x="450" y="142" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" letter-spacing="6" fill="#c8f0ff" opacity="0.55">KYLE · BUILDER · KOELS.SITE</text>

  <!-- bottom accent line -->
  <line x1="280" y1="168" x2="620" y2="168" stroke="url(#grad)" stroke-width="1" opacity="0.35"/>
</svg>
